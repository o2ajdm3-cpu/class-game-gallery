<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 반 게임 전시회</title><link rel="stylesheet" href="style.css"></head><body><div class="shell"><header><div class="brand">🎮 <span>우리 반 <b>게임 전시회</b></span></div><div class="header-actions"><span id="identity">관람객</span><button id="loginBtn" class="secondary">학생 로그인</button><button id="teacherBtn" class="secondary">교사 모드</button></div></header><main><section class="hero"><div><span class="eyebrow">✨ 우리 반 16명의 작은 게임 개발자</span><h1>만들고, 플레이하고,<br><em>서로 성장하는 게임 놀이터!</em></h1><p>친구들이 직접 만든 게임을 만나고 따뜻한 피드백을 남겨 보세요.</p><div class="hero-actions"><button id="uploadBtn">＋ 내 게임 등록하기</button><button id="browseBtn" class="light">게임 구경하기 ↓</button></div></div><div class="hero-art" aria-hidden="true">🕹️<span>⭐</span><small>👾</small></div></section><section class="stats"><div><b id="submitted">0</b><span>등록된 게임</span></div><div><b>16</b><span>우리 반 개발자</span></div><div><b id="feedbackCount">0</b><span>서로 남긴 피드백</span></div></section><section id="gallery"><div class="section-head"><div><span class="eyebrow">GAME GALLERY</span><h2>친구들의 게임 🎲</h2></div><div class="filters"><input id="search" placeholder="🔎 게임 제목 검색"><select id="sort"><option value="number">학생 번호순</option><option value="new">최근 등록순</option><option value="feedback">피드백 많은 순</option></select></div></div><div id="cards" class="cards"></div></section></main><footer>우리 반 게임 전시회 · 서로를 존중하는 피드백을 남겨요 💜</footer></div><div id="modal" class="modal hidden"><div class="dialog"><button class="close" id="closeModal" aria-label="닫기">×</button><div id="modalContent"></div></div></div><script src="config.js"></script><script src="app.js"></script></body></html>
